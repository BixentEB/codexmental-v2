<style>
/* Concept : une fenêtre sur un vrai système solaire en 3D ; chaque planète est une section du site. Thème sombre assumé (espace), un seul univers visuel. */
:root {
  --void: #03040a;
  --deep: #0a0d22;
  --ink: #e9ecf8;
  --mute: #8f96b8;
  --sun: #ffb23e;
  --line: rgba(150, 170, 255, 0.16);
  --font-display: "Syne", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--void); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 24px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(20px, 3.4vw, 28px);
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.stage {
  position: relative;
  height: clamp(520px, 72vh, 760px);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--void);
  box-shadow: 0 30px 80px -30px rgba(40, 60, 180, 0.35);
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.over { cursor: pointer; }
#cv:active { cursor: grabbing; }
.loading {
  position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; text-align: center; padding: 24px;
  background: var(--void); color: var(--mute); font-size: 14px; transition: opacity .6s;
}
.loading.done { opacity: 0; pointer-events: none; }

.bar {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px;
  background: linear-gradient(to bottom, rgba(3, 4, 10, 0.78), rgba(3, 4, 10, 0));
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.02em; white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  appearance: none; border: 0; background: transparent; color: var(--mute);
  font: 500 13px/1 var(--font-body); padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: color .2s, background .2s;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="true"] { color: var(--ink); background: rgba(255, 255, 255, 0.09); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

.pl { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 3; pointer-events: none; transition: opacity .3s; will-change: transform; }
.pl .hit {
  position: absolute; appearance: none; border: 0; background: transparent; padding: 0; border-radius: 50%; pointer-events: none;
  width: var(--hit); height: var(--hit); left: calc(var(--hit) / -2); top: calc(var(--hit) / -2); transition: box-shadow .2s;
}
.pl.hov .hit, .pl.active .hit { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.55); }
.pl .lbl {
  position: absolute; top: -17px; white-space: nowrap;
  font-family: var(--font-display); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 0, 0, 0.95);
  display: flex; flex-direction: column; gap: 1px;
}
.pl .lbl b { font-weight: 600; font-size: 15px; letter-spacing: 0.01em; }
.pl .lbl i { font-style: normal; font-family: var(--font-body); font-size: 11px; color: var(--mute); }
.pl.right .lbl { left: calc(var(--s) + 12px); text-align: left; }
.pl.left .lbl { right: calc(var(--s) + 12px); text-align: right; }
.pl.below .lbl { left: 50%; top: calc(var(--s) + 8px); transform: translateX(-50%); text-align: center; align-items: center; }
.pl.active .lbl b { color: #fff; }
.pl.dim { opacity: 0.38; }
.pl.hid { opacity: 0; }

.under { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.info, .ctrl { border: 1px solid var(--line); border-radius: 14px; background: var(--deep); padding: 16px 18px; min-width: 0; }
.info h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--c, var(--sun)); box-shadow: 0 0 12px var(--c, var(--sun)); }
.info p { margin: 0; color: var(--mute); max-width: 62ch; }
.ctrl { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row label { color: var(--mute); font-size: 13px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--ink);
  font: 500 13px/1 var(--font-body); padding: 9px 14px; border-radius: 999px; cursor: pointer;
}
.btn:hover { background: rgba(255, 255, 255, 0.1); }
select {
  font: 500 13px/1 var(--font-body); color: var(--ink); background: #11152e; border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px;
}
input[type="range"] { accent-color: var(--sun); flex: 1; min-width: 100px; }
output { font-variant-numeric: tabular-nums; min-width: 3ch; font-size: 13px; }
.hint { color: var(--mute); font-size: 12.5px; margin: 0; }

@media (max-width: 720px) {
  .under { grid-template-columns: minmax(0, 1fr); }
  .stage { height: clamp(540px, 76vh, 660px); }
  .bar { flex-direction: column; align-items: flex-start; gap: 4px; }
  .tabs { width: 100%; }
}
</style>
